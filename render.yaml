services:
  - type: web
    name: beauty-salon
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn salon_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: beauty-salon-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

databases:
  - name: beauty-salon-db
    plan: free