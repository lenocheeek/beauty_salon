{% extends 'base.html' %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; text-align: center;">
    <div style="font-size: 48px; margin-bottom: 16px;">💄</div>
    <h2 style="text-align: center; border-left: none;">Добро пожаловать</h2>
    <p style="color: #6c757d; margin-bottom: 30px;">Войдите в учётную запись</p>
    
    {% if form.errors %}
        <p style="color: #e11d48; background: #ffe4ec; padding: 10px; border-radius: 40px;">Неверный логин или пароль.</p>
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        <div>
            <input type="text" name="username" placeholder="Логин" required autofocus>
        </div>
        <div>
            <input type="password" name="password" placeholder="Пароль" required>
        </div>
        <button type="submit" style="width: 100%; margin-top: 12px;">Войти</button>
    </form>
</div>
{% endblock %}
