{% extends 'base.html' %}

{% block title %}Сотрудники{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
    <h2>Сотрудники салона</h2>
    {% if user.groups.all.0.name == 'Администратор' %}
        <a href="{% url 'employee_add' %}" class="btn">+ Добавить сотрудника</a>
    {% endif %}
</div>

<!-- Динамический поиск -->
<div style="margin: 20px 0;">
    <input type="text" id="searchInput" placeholder="🔍 Введите фамилию, имя или специализацию..." 
           value="{{ search_query }}"
           style="width: 100%; padding: 12px 20px; border-radius: 40px; border: 1px solid #fbc4d8; font-size: 16px; outline: none;">
    <div id="searchLoader" style="display: none; text-align: center; margin-top: 10px; color: #d946ef;">⏳ Загрузка...</div>
</div>

<div id="employeesTableContainer">
    {% include 'employees/_employees_table.html' with employees=employees %}
</div>

<script>
    const searchInput = document.getElementById('searchInput');
    const container = document.getElementById('employeesTableContainer');
    const loader = document.getElementById('searchLoader');
    let searchTimeout;
    
    function performSearch() {
        const query = searchInput.value;
        loader.style.display = 'block';
        
        fetch(`/employees/?q=${encodeURIComponent(query)}`, {
            headers: {'X-Requested-With': 'XMLHttpRequest'}
        })
        .then(response => response.text())
        .then(html => {
            container.innerHTML = html;
            loader.style.display = 'none';
            attachPaginationEvents();
        })
        .catch(error => {
            console.error('Ошибка:', error);
            loader.style.display = 'none';
        });
    }
    
    function attachPaginationEvents() {
        document.querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.href;
                const query = searchInput.value;
                loader.style.display = 'block';
                fetch(`${url}&q=${encodeURIComponent(query)}`, {
                    headers: {'X-Requested-With': 'XMLHttpRequest'}
                })
                .then(response => response.text())
                .then(html => {
                    container.innerHTML = html;
                    loader.style.display = 'none';
                    attachPaginationEvents();
                });
            });
        });
    }
    
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(performSearch, 300);
    });
    
    attachPaginationEvents();
</script>
{% endblock %}
