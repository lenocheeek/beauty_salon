{% extends 'base.html' %}

{% block title %}Клиенты{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
    <h2>📋 Клиенты салона</h2>
    {% if user.groups.all.0.name == 'Администратор' %}
        <a href="{% url 'client_add' %}" class="btn">+ Добавить клиента</a>
    {% endif %}
</div>

<!-- Динамический поиск -->
<div style="margin: 20px 0;">
    <input type="text" id="searchInput" placeholder="🔍 Введите фамилию, имя или телефон..." 
           value="{{ search_query }}"
           style="width: 100%; padding: 12px 20px; border-radius: 40px; border: 1px solid #fbc4d8; font-size: 16px; outline: none; transition: all 0.3s;">
    <div id="searchLoader" style="display: none; text-align: center; margin-top: 10px; color: #d946ef;">⏳ Загрузка...</div>
</div>

<!-- Контейнер для таблицы -->
<div id="clientsTableContainer">
    {% include 'clients/_clients_table.html' with clients=clients %}
</div>

<script>
    const searchInput = document.getElementById('searchInput');
    const container = document.getElementById('clientsTableContainer');
    const loader = document.getElementById('searchLoader');
    let searchTimeout;
    
    function performSearch() {
        const query = searchInput.value;
        loader.style.display = 'block';
        
        fetch(`/clients/?q=${encodeURIComponent(query)}`, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.text())
        .then(html => {
            container.innerHTML = html;
            loader.style.display = 'none';
            attachPaginationEvents();
        })
        .catch(error => {
            console.error('Ошибка:', error);
            loader.style.display = 'none';
        });
    }
    
    function attachPaginationEvents() {
        document.querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.href;
                const query = searchInput.value;
                loader.style.display = 'block';
                
                fetch(`${url}&q=${encodeURIComponent(query)}`, {
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => response.text())
                .then(html => {
                    container.innerHTML = html;
                    loader.style.display = 'none';
                    attachPaginationEvents();
                });
            });
        });
    }
    
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(performSearch, 300);
    });
    
    // При загрузке страницы привязываем события к пагинации
    attachPaginationEvents();
</script>

<style>
    #searchInput:focus {
        border-color: #d946ef;
        box-shadow: 0 0 0 3px rgba(217,70,239,0.2);
    }
</style>
{% endblock %}
